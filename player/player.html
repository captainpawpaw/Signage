<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signage Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="stage">
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
    <div id="overlay" hidden></div>
    <div id="idle" hidden>
      <div class="idle-name"></div>
      <div class="idle-code" hidden></div>
      <div class="idle-msg"></div>
      <div class="idle-hint"></div>
    </div>
    <div id="identify" hidden></div>
    <div id="offline" class="corner" hidden>
      <img class="offline-qr" alt="" hidden>
      <div class="offline-text">
        <div class="offline-msg" hidden></div>
        <div class="offline-status"><span class="offline-dot"></span>Reconnecting…</div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="player.js"></script>
</body>
</html>
