<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signage Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="stage">
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
    <div id="idle" hidden>
      <div class="idle-name"></div>
      <div class="idle-msg"></div>
    </div>
    <div id="identify" hidden></div>
  </div>
  <div id="conn" hidden title="Not connected to signage server"></div>
  <script src="config.js"></script>
  <script src="player.js"></script>
</body>
</html>
